<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 105" width="240" height="105" fill="none">
  <defs>
    <linearGradient id="pnmGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123D7D" />
      <stop offset="50%" stop-color="#123D7D" />
      <stop offset="65%" stop-color="#2BA03A" />
      <stop offset="100%" stop-color="#2BA03A" />
    </linearGradient>
  </defs>

  <g transform="translate(15, 6)">
    <!-- Infinity Left Loop (Navy) -->
    <path d="M 52,30 
             C 40,15 22,15 12,25 
             C 2,35 2,47 12,57 
             C 22,67 40,67 52,51 
             C 62,38 74,26 86,26 
             C 98,26 108,34 110,44 
             C 112,54 104,66 90,66 
             C 76,66 64,52 52,38" 
          stroke="url(#pnmGrad1)" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>

    <!-- Upward arrow growth tail branching up-right from the right loop -->
    <path d="M 94,32 L 118,12" 
          stroke="#2BA03A" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Arrow head -->
    <polygon points="106,6 128,8 126,30" fill="#2BA03A"/>
  </g>

  <!-- Typography -->
  <!-- Underscore bar -->
  <rect x="22" y="80" width="22" height="3.5" fill="#123D7D" rx="1.75"/>
  
  <!-- PNM letters -->
  <text x="50" y="84" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" fill="#123D7D" letter-spacing="3.5">PNM</text>
  
  <!-- Subtitle -->
  <text x="22" y="98" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="600" fill="#4A5568" letter-spacing="0.4">People Network Management</text>
</svg>
